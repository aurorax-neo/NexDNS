name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (例如 v0.1.2)'
        required: false
        default: 'v0.1.2'

permissions:
  contents: write
  packages: write

jobs:
  build-frontend:
    name: Build Frontend UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove local cargo proxy in CI
        shell: bash
        run: rm -f backend/.cargo/config.toml

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools on Linux
        if: matrix.os == 'ubuntu-latest' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build target binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --manifest-path Cargo.toml
          else
            cargo build --release --target ${{ matrix.target }} --manifest-path Cargo.toml
          fi

      - name: Package archive
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          [ "$TAG_NAME" = "" ] || [ "$TAG_NAME" = "main" ] && TAG_NAME="dev"
          PKG_NAME="nexdns_${TAG_NAME}_${{ matrix.target }}"
          ROOT_DIR="$(pwd)"
          mkdir -p "${ROOT_DIR}/release-packages"
          mkdir -p release-pkg

          BIN_NAME="nexdns"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          fi

          cp "target/${{ matrix.target }}/release/nexdns${EXT}" "release-pkg/nexdns${EXT}"
          cp README.md release-pkg/ 2>/dev/null || true
          cp LICENSE release-pkg/ 2>/dev/null || true

          if [ "${{ runner.os }}" = "Windows" ]; then
            cd release-pkg
            7z a "${ROOT_DIR}/release-packages/${PKG_NAME}.zip" *
          else
            cd release-pkg
            tar -czvf "${ROOT_DIR}/release-packages/${PKG_NAME}.tar.gz" *
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: release-packages/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release Assets
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: package-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          mkdir -p release-assets
          cp downloaded-artifacts/* release-assets/
          cd release-assets
          sha256sum * > checksums.txt
          echo "=== Release Checksums ==="
          cat checksums.txt

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  docker:
    name: Publish Multi-arch Docker Image to GHCR
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download linux-amd64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: package-x86_64-unknown-linux-musl
          path: pkg-amd64

      - name: Download linux-arm64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: package-aarch64-unknown-linux-musl
          path: pkg-arm64

      - name: Prepare multi-arch binaries
        shell: bash
        run: |
          mkdir -p docker-bin/amd64 docker-bin/arm64
          tar -xvf pkg-amd64/*.tar.gz -C docker-bin/amd64/
          tar -xvf pkg-arm64/*.tar.gz -C docker-bin/arm64/
          chmod +x docker-bin/amd64/nexdns docker-bin/arm64/nexdns
          ls -la docker-bin/amd64/ docker-bin/arm64/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nexdns
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
