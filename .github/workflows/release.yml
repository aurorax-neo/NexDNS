name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号 (例如 v0.1.12)"
        required: true
        default: "v0.1.12"
      force_build:
        description: "强制云端重新编译打包（默认优先复用已上传的本地制品以节省额度）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

# 同版本重推 Tag 或手动重试时自动取消前序未完成任务，杜绝额度浪费
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 阶段 0: 1x 极速前置守门员（耗时 ~8s）+ 本地已上传制品短路判定
  validate-release:
    name: Validate Release & Gate Quota
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      body: ${{ steps.changelog.outputs.body }}
      needs_build: ${{ steps.gate.outputs.needs_build }}
    steps:
      - name: Checkout target tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      # ── 约束 1：Tag 必须符合 SemVer ──────────────────────────
      - name: Validate tag format (SemVer)
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' 不符合 SemVer（应为 vX.Y.Z 或 vX.Y.Z-pre）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 约束 2：源码版本号与 Tag 一致 ─────────────────────────
      - name: Verify source version matches Tag
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"; VER="${TAG#v}"
          CARGO_VER=$(grep -m1 '^version' backend/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          PKG_VER=$(grep -m1 '"version"' frontend/package.json | sed -E 's/.*"version":[[:space:]]*"([^"]+)".*/\1/')
          if [ "$CARGO_VER" != "$VER" ]; then
            echo "::error::backend/Cargo.toml version=$CARGO_VER 与 Tag=$VER 不一致"
            exit 1
          fi
          if [ "$PKG_VER" != "$VER" ]; then
            echo "::error::frontend/package.json version=$PKG_VER 与 Tag=$VER 不一致"
            exit 1
          fi

      # ── 约束 3：CHANGELOG 必须包含当前版本段落且非空 ─────────
      - name: Verify & extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"; VER="${TAG#v}"
          if ! grep -qE "^##[[:space:]]*\[?${VER//./\\.}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少版本 $VER 的条目，请先补充后重推 Tag"
            exit 1
          fi
          BODY=$(awk -v ver="$VER" '
            $0 ~ "^##[[:space:]]*\\[?"ver"\\]?" {flag=1; next}
            flag && /^## / {exit}
            flag && NF {print}
          ' CHANGELOG.md)
          if [ -z "${BODY//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md 中版本 $VER 内容为空"
            exit 1
          fi
          { echo "body<<__CHANGELOG_EOF__"; echo "$BODY"; echo "__CHANGELOG_EOF__"; } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$BODY" > RELEASE_BODY.md

      # ── 节流门控：若 Release 已具备全量目标制品且未强制重编，直接同步日志并短路 ──
      - name: Check pre-uploaded release assets
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FORCE="${{ inputs.force_build || false }}"
          EXPECTED_ASSETS=(
            "nexdns_${TAG}_x86_64-unknown-linux-musl.tar.gz"
            "nexdns_${TAG}_aarch64-unknown-linux-musl.tar.gz"
            "nexdns_${TAG}_aarch64-apple-darwin.tar.gz"
            "nexdns_${TAG}_x86_64-apple-darwin.tar.gz"
            "nexdns_${TAG}_x86_64-pc-windows-msvc.zip"
          )

          EXISTING="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          ALL_PRESENT=true
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if ! grep -qxF "$asset" <<< "$EXISTING"; then
              ALL_PRESENT=false
              break
            fi
          done

          if [ "$FORCE" != "true" ] && [ "$ALL_PRESENT" = "true" ]; then
            echo "检测到 $TAG 全量制品已存在，直接同步 CHANGELOG Release Notes，跳过云端编译以节省额度"
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_BODY.md --prerelease="${{ steps.meta.outputs.prerelease }}"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  # 阶段 1: 前端构建
  build-frontend:
    name: Build Frontend UI
    needs: validate-release
    if: needs.validate-release.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout target tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Remove local npm mirror config
        shell: bash
        run: rm -f .npmrc frontend/.npmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js 24 with cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install & build frontend
        working-directory: frontend
        shell: bash
        run: |
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
          pnpm build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # 阶段 2: 多架构二进制并行交叉编译（macOS 单机双架构同编，省一半 10x 额度）
  build-binaries:
    name: Build Binaries (${{ matrix.label }})
    needs: [validate-release, build-frontend]
    if: needs.validate-release.outputs.needs_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
            use_cross: false
          - label: linux-arm64
            os: ubuntu-24.04
            targets: aarch64-unknown-linux-musl
            use_cross: true
          - label: macos-universal-pair
            os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            use_cross: false
          - label: windows-amd64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
            use_cross: false
    steps:
      - name: Checkout target tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Remove local Cargo proxy in CI
        shell: bash
        run: find . -path '*/.cargo/config.toml' -o -path '*/.cargo/config' | xargs rm -f

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Install musl tools on Linux (native amd64)
        if: matrix.os == 'ubuntu-24.04' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools musl-dev

      # 严禁 cargo install 源码现编，使用预编译二进制 1.5s 安装完成
      - name: Install prebuilt cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build & package target binaries
        shell: bash
        env:
          CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
        run: |
          TAG_NAME="${{ needs.validate-release.outputs.tag }}"
          BIN_NAME="nexdns"
          ROOT_DIR="$(pwd)"
          mkdir -p "${ROOT_DIR}/release-packages"

          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"

          IFS=',' read -ra TARGET_LIST <<< "${{ matrix.targets }}"
          for TARGET in "${TARGET_LIST[@]}"; do
            if [ "${{ matrix.use_cross }}" = "true" ]; then
              cross build --release --locked --target "$TARGET"
            else
              cargo build --release --locked --target "$TARGET"
            fi

            STAGE_DIR="${ROOT_DIR}/stage-${TARGET}"
            mkdir -p "$STAGE_DIR"
            cp "target/${TARGET}/release/${BIN_NAME}${EXT}" "${STAGE_DIR}/${BIN_NAME}${EXT}"
            cp README.md "$STAGE_DIR/" 2>/dev/null || true
            cp LICENSE "$STAGE_DIR/" 2>/dev/null || true

            PKG_NAME="nexdns_${TAG_NAME}_${TARGET}"
            if [ "${{ runner.os }}" = "Windows" ]; then
              (cd "$STAGE_DIR" && 7z a "${ROOT_DIR}/release-packages/${PKG_NAME}.zip" *)
            else
              (cd "$STAGE_DIR" && tar -czf "${ROOT_DIR}/release-packages/${PKG_NAME}.tar.gz" *)
            fi
          done

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.label }}
          path: release-packages/*
          if-no-files-found: error
          retention-days: 1

  # 阶段 3: 汇总发布 GitHub Release 压缩包与 SHA256 校验和
  publish-release:
    name: Publish GitHub Release Assets
    needs: [validate-release, build-binaries]
    if: needs.validate-release.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum * > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          tag_name: ${{ needs.validate-release.outputs.tag }}
          name: ${{ needs.validate-release.outputs.tag }}
          body: ${{ needs.validate-release.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}

  # 阶段 4: 零 QEMU 秒级发布多架构 Docker 镜像
  docker:
    name: Publish Multi-arch Docker Image to GHCR
    needs: [validate-release, build-binaries]
    if: needs.validate-release.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Dockerfile.release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download Linux amd64 & arm64 packages
        uses: actions/download-artifact@v8
        with:
          path: linux-pkgs
          pattern: package-linux-*
          merge-multiple: true

      - name: Unpack multi-arch static binaries
        shell: bash
        run: |
          TAG="${{ needs.validate-release.outputs.tag }}"
          mkdir -p docker-bin/amd64 docker-bin/arm64
          tar -xzf "linux-pkgs/nexdns_${TAG}_x86_64-unknown-linux-musl.tar.gz" -C docker-bin/amd64/
          tar -xzf "linux-pkgs/nexdns_${TAG}_aarch64-unknown-linux-musl.tar.gz" -C docker-bin/arm64/
          chmod +x docker-bin/amd64/nexdns docker-bin/arm64/nexdns

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nexdns
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-release.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.validate-release.outputs.prerelease != 'true' }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify & record image digest
        shell: bash
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::未获取到多架构镜像 Digest，阻断静默异常发布"
            exit 1
          fi
          {
            echo "### 📦 Multi-arch Docker Image Published"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/nexdns:${{ needs.validate-release.outputs.tag }}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
