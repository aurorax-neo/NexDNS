dns:
  port: 53
  connect_ip_version: dual
web:
  port: 3000
proxy:
  enabled: true
  socks5: "socks5://10.96.1.108:7890"
  list:
    - id: local_clash
      name: "本地 Clash/Mihomo 节点"
      addr: "socks5://10.96.1.108:7890"
      is_default: true
cache:
  size: 10000
  serve_expired: true
  prefetch: true
  min_ttl: 60
  max_ttl: 300
speed_check:
  enabled: true
  timeout_ms: 400
  cache_mins: 5
anti_pollution: true
upstreams:
  mainland:
  - udp://223.5.5.5:53
  - udp://119.29.29.29:53
  - https://223.5.5.5/dns-query#sni=dns.alidns.com
  - https://101.226.4.6/dns-query#sni=doh.360.cn
  gfw:
  - https://8.8.8.8/dns-query#sni=dns.google&proxy=default
  - https://cloudflare-dns.com/dns-query#proxy=default
  - https://1.1.1.1/dns-query#sni=cloudflare-dns.com&proxy=default
  overseas:
  - https://1.1.1.1/dns-query#sni=cloudflare-dns.com&proxy=default
  - https://8.8.8.8/dns-query#sni=dns.google&proxy=default
  timeout_ms: 2000
