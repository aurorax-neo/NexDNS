dns:
  enabled: true
  port: 53
  listen_mode: dual
  connect_ip_version: dual
  response_mode: dual
  doh_enabled: true
  doh_port: 8053
  doh_path: /dns-query
  block_type: zero_ip
  block_ttl: 60
web:
  port: 3000
proxy:
  enabled: false
  list: []
cache:
  size: 10000
  prefetch: true
  min_ttl: 60
  max_ttl: 1800
speed_check:
  enabled: true
  timeout_ms: 400
  cache_mins: 5
  mode: tcp_80_443
  direct_only: true
routing:
  enabled: true
  fallback_timeout_ms: 800
  custom_direct_domains: []
  custom_proxy_domains: []
logging:
  enabled: true
  retention_mins: 60
  max_disk_usage_percent: 90
  min_free_disk_mb: 512
  max_db_size_mb: 512
rules_update:
  auto_update: true
  interval_mins: 1440
upstreams:
  bootstrap_dns:
  - https://223.5.5.5/dns-query#sni=dns.alidns.com
  - https://1.12.12.12/dns-query#sni=doh.pub
  - https://218.30.118.6/dns-query#sni=doh.360.cn
  mainland:
  - https://1.12.12.12/dns-query#sni=doh.pub
  - https://101.226.4.6/dns-query#sni=doh.360.cn
  - https://223.5.5.5/dns-query#sni=dns.alidns.com
  gfw:
  - https://8.8.8.8/dns-query#sni=dns.google&proxy=default
  - https://8.8.4.4/dns-query#sni=dns.google&proxy=default
  - https://1.1.1.1/dns-query#proxy=default
  - https://194.242.2.2/dns-query#sni=dns.mullvad.net&proxy=default
  overseas:
  - https://194.242.2.2/dns-query#sni=dns.mullvad.net&proxy=none
  - https://194.242.2.4/dns-query#sni=base.dns.mullvad.net&proxy=none
  - https://158.64.1.29/dns-query#sni=kaitain.restena.lu&proxy=none
  - https://185.228.169.9/doh/security-filter/#sni=doh.cleanbrowsing.org&proxy=none
  - https://185.95.218.43/dns-query#sni=dns.digitale-gesellschaft.ch&proxy=none
  - https://185.95.218.42/dns-query#sni=dns.digitale-gesellschaft.ch&proxy=none
  timeout_ms: 4000
