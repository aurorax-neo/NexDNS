services:
  nexdns:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexdns:latest
    container_name: nexdns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"
      - "8053:8053/tcp"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
