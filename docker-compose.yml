services:
  nexdns:
    image: dx.aorz.kdns.fr/ghcr.io/aurorax-neo/nexdns:latest
    container_name: nexdns
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"
      - "8053:8053/tcp"
    volumes:
      - /opt/docker/nexdns/data:/app/data
    environment:
      - TZ=Asia/Shanghai
